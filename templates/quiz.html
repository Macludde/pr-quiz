<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · __TITLE__</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fffdf8; --ink: #1d1b16; --soft: #6b665b; --line: #e4dfd3;
    --ok: #1f7a5a; --okbg: #e3f3ec; --bad: #b23a2e; --badbg: #f8e5e2; --accent: #2c5bd6; --code: #f1eee6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15161a; --card: #1d1f24; --ink: #ecebe6; --soft: #9a988f; --line: #2d3037;
      --ok: #5fd0a3; --okbg: #17342a; --bad: #f08a7e; --badbg: #3a1d1a; --accent: #8fb0ff; --code: #24272d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 Inter, ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 28px; }
  header h1 { font-size: 15px; font-weight: 600; color: var(--soft); margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 26px; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.cur { background: var(--accent); } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .kind { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h2 { font-size: 24px; line-height: 1.35; font-weight: 650; margin: 8px 0 20px; }
  .src { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--soft); text-decoration: none; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 6px 0 22px; }
  code { font: .88em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 1px 5px; border-radius: 5px; }
  pre code { background: none; padding: 0; font-size: inherit; }
  :not(pre) > code { overflow-wrap: anywhere; }
  h2, .why, button.opt { overflow-wrap: anywhere; }
  .opts { display: grid; gap: 10px; }
  button.opt { all: unset; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); transition: border-color .12s, background .12s; }
  button.opt:hover:not(:disabled), button.opt:focus-visible { border-color: var(--accent); }
  button.opt:disabled { cursor: default; }
  .key { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 1.5px solid var(--line); color: var(--soft); }
  .opt.right { border-color: var(--ok); background: var(--okbg); } .opt.right .key { border-color: var(--ok); color: var(--ok); }
  .opt.wrong { border-color: var(--bad); background: var(--badbg); } .opt.wrong .key { border-color: var(--bad); color: var(--bad); }
  .opt.dim { opacity: .55; }
  .why { margin-top: 22px; padding: 18px 20px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .why .verdict { font-weight: 700; margin-bottom: 6px; } .why .verdict.ok { color: var(--ok); } .why .verdict.bad { color: var(--bad); }
  .why p { margin: 0 0 10px; }
  .diagram { margin: 4px 0 14px; display: flex; justify-content: center; min-height: 40px; }
  .diagram svg { max-width: 100%; height: auto; }
  .diagram pre { width: 100%; }
  .ev { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .ev a { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  a { color: var(--accent); }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; color: var(--soft); font-size: 14px; }
  .next { all: unset; cursor: pointer; padding: 10px 18px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 600; }
  .next[hidden] { display: none; }
  .score { font-size: 64px; font-weight: 750; margin: 10px 0 4px; }
  .review { margin-top: 28px; display: grid; gap: 12px; }
  .review a.row { display: flex; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  @media (max-width: 600px) {
    body { font-size: 16px; }
    main { padding: 18px 14px 56px; }
    header { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 20px; }
    .dots { gap: 4px; } .dot { flex: 1; width: auto; }
    h2 { font-size: 20px; }
    pre { font-size: 12px; padding: 12px; margin-left: -4px; margin-right: -4px; }
    button.opt { padding: 13px 12px; gap: 12px; }
    .score { font-size: 52px; }
  }
  @media (hover: none) { .nav span { visibility: hidden; } .next { padding: 13px 22px; } }
  .home { color: var(--soft); text-decoration: none; }
  .mark { font-weight: 800; } .mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
const QUIZ = /*__QUIZ__*/null;
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
let mermaid = null;
try {
  mermaid = (await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs")).default;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "strict", fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif", flowchart: { useMaxWidth: true }, sequence: { useMaxWidth: true } });
} catch {}
let seq = 0;
async function drawDiagram(el, code) {
  if (!el) return;
  if (!mermaid) { el.innerHTML = `<pre><code>${esc(code)}</code></pre>`; return; }
  try { el.innerHTML = (await mermaid.render(`dg${seq++}`, code)).svg; }
  catch { el.innerHTML = `<pre><code>${esc(code)}</code></pre>`; }
}
window.__checkDiagrams = async () => {
  const out = [];
  for (const it of QUIZ.items) {
    try {
      const { svg } = await mermaid.render(`chk${it.n}`, it.diagram);
      const vb = svg.match(/viewBox="([-\d.]+) ([-\d.]+) ([\d.]+) ([\d.]+)"/);
      out.push({ n: it.n, width: vb ? +vb[3] : 0 });
    } catch (e) { out.push({ n: it.n, error: String(e?.message ?? e) }); }
  }
  return out;
};
const L = "ABCD";
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function md(s) {
  return s.split(/\n{2,}/).map((p) => "<p>" + esc(p)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g, "<br>") + "</p>").join("");
}
function dedent(t) {
  const ls = t.split("\n"), pad = Math.min(...ls.filter((l) => l.trim()).map((l) => l.match(/^\s*/)[0].length));
  return ls.map((l) => l.slice(pad)).join("\n");
}
const KEY = `pr-quiz:${QUIZ.repo}#${QUIZ.pr}@${QUIZ.sha}`;
let saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
const picks = saved?.picks?.length === QUIZ.items.length ? saved.picks : QUIZ.items.map(() => null);
let cur = picks.indexOf(null) < 0 ? QUIZ.items.length : picks.indexOf(null);
function save() {
  const right = QUIZ.items.filter((it, i) => picks[i] === it.answer).length;
  try { localStorage.setItem(KEY, JSON.stringify({ picks, right, done: picks.every((p) => p != null) })); } catch {}
}
const app = document.getElementById("app");

function header() {
  const dots = QUIZ.items.map((it, i) => {
    const c = picks[i] == null ? (i === cur ? "cur" : "") : picks[i] === it.answer ? "ok" : "bad";
    return `<span class="dot ${c}"></span>`;
  }).join("");
  return `<header><h1>#${QUIZ.pr} · ${esc(QUIZ.title)}</h1><div class="dots">${dots}</div></header>`;
}

function render() {
  if (cur >= QUIZ.items.length) return renderEnd();
  const it = QUIZ.items[cur], pick = picks[cur], done = pick != null;
  const opts = it.options.map((o, k) => {
    const cls = !done ? "" : k === it.answer ? "right" : k === pick ? "wrong" : "dim";
    return `<button class="opt ${cls}" data-k="${k}" ${done ? "disabled" : ""}><span class="key">${L[k]}</span><span>${md(o).slice(3, -4)}</span></button>`;
  }).join("");
  const code = it.code ? `<a class="src" href="${it.code.href}" target="_blank" rel="noopener">${esc(it.code.label)}</a><pre><code>${esc(dedent(it.code.text))}</code></pre>` : "";
  const why = done ? `<div class="why"><div class="verdict ${pick === it.answer ? "ok" : "bad"}">${pick === it.answer ? "Right." : `Not quite: the answer is ${L[it.answer]}.`}</div><div class="diagram"></div>${md(it.why)}<div class="ev">${it.evidence.map((e) => `<a href="${e.href}" target="_blank" rel="noopener">${esc(e.label)}</a>`).join("")}</div></div>` : "";
  app.innerHTML = `${header()}<div class="kind">${cur + 1} / ${QUIZ.items.length} · ${esc(it.kindLabel)}</div><h2>${md(it.q).slice(3, -4)}</h2>${code}<div class="opts">${opts}</div>${why}
    <div class="nav"><span>${done ? "Enter for next" : `Press ${L.slice(0, it.options.length).split("").join(" / ")}`}</span><button class="next" ${done ? "" : "hidden"}>${cur + 1 === QUIZ.items.length ? "See score" : "Next"} →</button></div>`;
  app.querySelectorAll("button.opt").forEach((b) => b.onclick = () => choose(+b.dataset.k));
  app.querySelector(".next").onclick = next;
  if (done) drawDiagram(app.querySelector(".diagram"), it.diagram);
}

function renderEnd() {
  const right = QUIZ.items.filter((it, i) => picks[i] === it.answer).length;
  const rows = QUIZ.items.map((it, i) => {
    const ok = picks[i] === it.answer;
    return `<a class="row" href="#" data-i="${i}"><span class="mark ${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"}</span><span><b>${esc(it.kindLabel)}</b> · ${md(it.q).slice(3, -4)}</span></a>`;
  }).join("");
  app.innerHTML = `${header()}<div class="kind">Score</div><div class="score">${right} / ${QUIZ.items.length}</div>
    <p>${right === QUIZ.items.length ? "You own this PR." : "Reopen the misses and read the linked lines before approving."}</p><div class="review">${rows}</div>
    <p style="margin-top:28px"><a href="https://github.com/${QUIZ.repo}/pull/${QUIZ.pr}">Back to the PR</a> · <a class="home" href="../../../">All quizzes</a> · <a class="home" href="#" id="reset">Retake</a></p>`;
  app.querySelector("#reset").onclick = (e) => { e.preventDefault(); picks.fill(null); save(); cur = 0; render(); };
  app.querySelectorAll("a.row").forEach((a) => a.onclick = (e) => { e.preventDefault(); cur = +a.dataset.i; render(); });
}

function choose(k) {
  if (picks[cur] != null || k >= QUIZ.items[cur].options.length) return;
  picks[cur] = k;
  save();
  render();
  app.querySelector(".why")?.scrollIntoView({ behavior: "smooth", block: "start" });
}
function next() {
  cur = picks.findIndex((p, i) => p == null && i > cur) >= 0 ? picks.findIndex((p, i) => p == null && i > cur) : picks.indexOf(null) >= 0 ? picks.indexOf(null) : QUIZ.items.length;
  render();
  scrollTo(0, 0);
}
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = "abcd".indexOf(e.key.toLowerCase()), d = "1234".indexOf(e.key);
  if (cur < QUIZ.items.length && (k >= 0 || d >= 0)) choose(k >= 0 ? k : d);
  else if ((e.key === "Enter" || e.key === "ArrowRight") && picks[cur] != null) next();
});
render();
</script>
</body>
</html>
